name: Build NoteVault Multi-Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - desktop

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.7'
  ANDROID_TARGET_SDK: '36'
  ANDROID_MIN_SDK: '24'

jobs:
  # ====================
  # Android Build Job
  # ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.java.home=$JAVA_HOME" >> local.properties

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Prepare publishable artifact directories
        run: |
          mkdir -p app/build/outputs/publish/android
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} app/build/outputs/publish/android/ \;
          ls -R app/build/outputs/publish/android || true

      - name: Sign APK
        if: ${{ secrets.ANDROID_SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/publish/android
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        continue-on-error: true

      - name: List APK outputs
        run: |
          echo "Debug APK files:"
          find app/build/outputs/apk/debug -name "*.apk" -type f
          echo "\nRelease APK files:"
          find app/build/outputs/apk/release -name "*.apk" -type f || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: notevault-debug-apk
          path: app/build/outputs/publish/android/*.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-release-apk
          path: app/build/outputs/publish/android/*.apk
          retention-days: 30

      - name: Upload Android Publishing Bundle
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: notevault-android-publish-bundle
          path: app/build/outputs/publish/android/
          retention-days: 30

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: app/build/reports/
          retention-days: 7

  # ====================
  # iOS Build Job
  # ====================
  build-ios:
    name: Build iOS Framework/IPA
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build iOS Framework
        run: |
          mkdir -p app/build/outputs/publish/ios
          ./gradlew :app:buildFramework --stacktrace || true
          find app/build/outputs -type f \( -name "*.framework" -o -name "*.xcarchive" -o -name "*.ipa" \) -exec cp -R {} app/build/outputs/publish/ios/ \; 2>/dev/null || true
          find app/build/outputs/publish/ios -maxdepth 2 -type f | sed 's#^#/#' || true
        continue-on-error: true

      - name: Build iOS IPA (requires Xcode project)
        run: |
          mkdir -p app/build/outputs/ipa app/build/outputs/publish/ios
          if [ -d "iosApp" ] && [ -f "iosApp/iosApp.xcodeproj/project.pbxproj" ]; then
            xcodebuild -project iosApp/iosApp.xcodeproj \
              -scheme iosApp \
              -configuration Release \
              -sdk iphoneos \
              -archivePath app/build/outputs/ipa/iosApp.xcarchive \
              build || true
            xcodebuild -exportArchive \
              -archivePath app/build/outputs/ipa/iosApp.xcarchive \
              -exportPath app/build/outputs/ipa \
              -exportOptionsPlist iosApp/ExportOptions.plist || true
          else
            echo "No iOS Xcode project present; packaging the framework bundle only."
          fi
          find app/build/outputs/ipa -type f \( -name "*.ipa" -o -name "*.xcarchive" \) -exec cp -R {} app/build/outputs/publish/ios/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-ios-framework
          path: app/build/outputs/framework/
          retention-days: 30

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-ios-ipa
          path: app/build/outputs/publish/ios/**
          retention-days: 30

      - name: Upload iOS Publish Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-ios-publish-bundle
          path: app/build/outputs/publish/ios/
          retention-days: 30

  # ====================
  # macOS Desktop Build
  # ====================
  build-macos:
    name: Build macOS Desktop
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build macOS DMG
        run: |
          ./gradlew :app:packageDmg --stacktrace
        continue-on-error: true

      - name: Create DMG with proper structure
        run: |
          mkdir -p app/build/outputs/package/macos
          if [ -f "app/build/distributions/*.dmg" ]; then
            mv app/build/distributions/*.dmg app/build/outputs/package/macos/
          fi
        continue-on-error: true

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-macos-dmg
          path: app/build/outputs/package/macos/*.dmg
          retention-days: 30

  # ====================
  # Linux Desktop Build
  # ====================
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgconf-2-4 libx11-dev libxext-dev libxrender-dev libxinerama-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Linux DEB
        run: |
          ./gradlew :app:packageDeb --stacktrace
        continue-on-error: true

      - name: Build Linux AppImage
        run: |
          ./gradlew :app:packageAppImage --stacktrace
        continue-on-error: true

      - name: Create output directory
        run: |
          mkdir -p app/build/outputs/package/linux
        continue-on-error: true

      - name: Copy build outputs
        run: |
          if [ -f "app/build/distributions/*.deb" ]; then
            cp app/build/distributions/*.deb app/build/outputs/package/linux/
          fi
          if [ -f "app/build/distributions/*.AppImage" ]; then
            cp app/build/distributions/*.AppImage app/build/outputs/package/linux/
          fi
        continue-on-error: true

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-linux-deb
          path: app/build/outputs/package/linux/*.deb
          retention-days: 30

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-linux-appimage
          path: app/build/outputs/package/linux/*.AppImage
          retention-days: 30

  # ====================
  # Windows Desktop Build
  # ====================
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Windows MSI
        run: |
          .\gradlew :app:packageMsi --stacktrace
        shell: cmd
        continue-on-error: true

      - name: Build Windows EXE
        run: |
          .\gradlew :app:packageExe --stacktrace
        shell: cmd
        continue-on-error: true

      - name: Create output directory
        run: |
          mkdir -p app\build\outputs\package\windows
        shell: cmd
        continue-on-error: true

      - name: Copy build outputs
        run: |
          if exist "app\build\distributions\*.msi" (
            copy app\build\distributions\*.msi app\build\outputs\package\windows\
          )
          if exist "app\build\distributions\*.exe" (
            copy app\build\distributions\*.exe app\build\outputs\package\windows\
          )
        shell: cmd
        continue-on-error: true

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-windows-msi
          path: app/build/outputs/package/windows/*.msi
          retention-days: 30

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notevault-windows-exe
          path: app/build/outputs/package/windows/*.exe
          retention-days: 30

  # ====================
  # Build Summary
  # ====================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-macos, build-linux, build-windows]
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate Summary
        run: |
          echo "# NoteVault Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- Android: ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: ${{ needs.build-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: ${{ needs.build-macos.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: ${{ needs.build-linux.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: ${{ needs.build-windows.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 Android APK (Debug/Release)" >> $GITHUB_STEP_SUMMARY
          echo "- 🍎 iOS Framework/IPA" >> $GITHUB_STEP_SUMMARY
          echo "- 🖥️ macOS DMG" >> $GITHUB_STEP_SUMMARY
          echo "- 🐧 Linux DEB/AppImage" >> $GITHUB_STEP_SUMMARY
          echo "- 🪟 Windows MSI/EXE" >> $GITHUB_STEP_SUMMARY

      - name: List artifacts
        run: |
          echo "Available artifacts:"
          ls -la
