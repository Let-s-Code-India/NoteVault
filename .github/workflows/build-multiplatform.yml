name: Build NoteVault - Android & iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

env:
  JAVA_VERSION: '17'
  ANDROID_TARGET_SDK: '36'
  ANDROID_MIN_SDK: '24'

jobs:
  # ====================
  # Android Build Job
  # ====================
  build-android:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.java.home=$JAVA_HOME" >> local.properties

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact directory
        run: |
          mkdir -p android-artifacts
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} android-artifacts/ \;
          ls -lh android-artifacts/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-artifacts/*.apk
          retention-days: 90
          overwrite: true

  # ====================
  # iOS Build Job
  # ====================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build iOS Archive (unsigned)
        run: |
          mkdir -p ios-artifacts
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ios-artifacts/iosApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          # xcodebuild -exportArchive requires an Apple Developer signing
          # identity, which is not available on CI runners. Since the
          # archive above is intentionally unsigned, we package the .app
          # from the archive into a standard .ipa (Payload/*.app zip)
          # ourselves. This IPA can be re-signed later with a real
          # certificate before installing on a device or submitting to
          # the App Store.
          APP_PATH="ios-artifacts/iosApp.xcarchive/Products/Applications/iosApp.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected app bundle not found at $APP_PATH"
            find ios-artifacts/iosApp.xcarchive -maxdepth 4
            exit 1
          fi

          mkdir -p ios-artifacts/Payload
          cp -R "$APP_PATH" ios-artifacts/Payload/
          (cd ios-artifacts && zip -r -y iosApp.ipa Payload)
          rm -rf ios-artifacts/Payload

      - name: List iOS artifacts
        run: |
          echo "=== iOS Build Artifacts ==="
          find ios-artifacts -maxdepth 1 -type f

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios-artifacts/iosApp.ipa
          retention-days: 90
          overwrite: true

  # ====================
  # Collect All Artifacts
  # ====================
  collect-artifacts:
    name: Collect All Build Artifacts
    runs-on: ubuntu-latest
    needs: [ build-android, build-ios ]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')

    steps:
      - name: Download Android APKs
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: final-release/android
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download iOS IPA
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: final-release/ios
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List all artifacts
        run: |
          echo "=== NoteVault Build Artifacts ==="
          find final-release -type f -exec ls -lh {} \;

      - name: Upload final release package
        uses: actions/upload-artifact@v4
        with:
          name: notevault-release-package
          path: final-release/
          retention-days: 90
          overwrite: true
