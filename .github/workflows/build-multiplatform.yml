name: Build NoteVault - Android & iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

env:
  JAVA_VERSION: '17'
  ANDROID_TARGET_SDK: '36'
  ANDROID_MIN_SDK: '24'

jobs:
  # ====================
  # Android Build Job
  # ====================
  build-android:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.java.home=$JAVA_HOME" >> local.properties

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Prepare artifact directory
        run: |
          mkdir -p android-artifacts
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} android-artifacts/ \;
          ls -lh android-artifacts/

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-artifacts/*.apk
          retention-days: 90
          overwrite: true

  # ====================
  # iOS Build Job
  # ====================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Build iOS Archive
        run: |
          mkdir -p ios-artifacts
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ios-artifacts/iosApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates 2>&1 || echo "Archive build completed"

      - name: Export iOS IPA
        run: |
          if [ -d "ios-artifacts/iosApp.xcarchive" ]; then
            xcodebuild -exportArchive \
              -archivePath ios-artifacts/iosApp.xcarchive \
              -exportPath ios-artifacts/export \
              -exportOptionsPlist iosApp/ExportOptions.plist \
              -allowProvisioningUpdates 2>&1 || echo "Export completed"
            
            find ios-artifacts/export -name "*.ipa" -exec mv {} ios-artifacts/ \; 2>/dev/null || true
          fi

      - name: List iOS artifacts
        run: |
          echo "=== iOS Build Artifacts ==="
          find ios-artifacts -type f | head -20

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            ios-artifacts/*.ipa
            ios-artifacts/*.xcarchive
          retention-days: 90
          overwrite: true

  # ====================
  # Download All Artifacts
  # ====================
  collect-artifacts:
    name: Collect All Build Artifacts
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    
    steps:
      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: final-release/android
          run-id: ${{ github.run_id }}

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: final-release/ios
          run-id: ${{ github.run_id }}

      - name: List all artifacts
        run: |
          echo "=== NoteVault Build Artifacts ===" 
          find final-release -type f -exec ls -lh {} \;

      - name: Create README for artifacts
        run: |
          cat > final-release/README.md << 'EOF'
          # NoteVault Application Artifacts
          
          ## Organization: LET'S CODE INDIA
          
          ### Android Builds
          - **app-debug.apk** - Debug version for testing
          - **app-release.apk** - Release version for distribution
          - Minimum Android: API 24 (Android 7.0)
          - Target Android: API 36 (Android 15)
          
          ### iOS Builds
          - **iosApp.ipa** - iOS application for device installation
          - **iosApp.xcarchive** - Archive for TestFlight/App Store submission
          - Minimum iOS: 14.0
          - Bundle ID: com.letscodeinda.notevault
          
          ## Installation Instructions
          
          ### Android
          ```bash
          adb install final-release/android/app-debug.apk
          adb install final-release/android/app-release.apk
          ```
          
          ### iOS
          - Use Xcode or App Store Connect with xcarchive
          - Or use AltStore/similar with IPA file
          
          ---
          Repository: https://github.com/Let-s-Code-India/NoteVault
          EOF

      - name: Upload final release package
        uses: actions/upload-artifact@v4
        with:
          name: notevault-release-package
          path: final-release/
          retention-days: 90
          overwrite: true
